name: "Build & Publish"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: "Build & Test"
    runs-on: gha-production-medium-arm64
    container: ci-images-release.arti.tw.ee/actions_java21
    env:
      GRADLE_OPTS: "-Djava.security.egd=file:/dev/./urandom -Dorg.gradle.parallel=true -Dorg.gradle.console=plain -Dorg.gradle.logging.stacktrace=all"
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
      - name: "Add repo as safe directory"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: "Clear dirty runner"
        run: |
          rm -rfv ~/.gradle || true
      - name: "Cache gradle"
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '*.gradle*', '*/*.gradle*') }}
          restore-keys: gradle-
      - name: "Assemble jar"
        run: ./gradlew assemble --info --parallel
      - name: "Compile tests"
        run: ./gradlew compileTest --info --parallel
      - name: "Run checks"
        run: ./gradlew check
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          require_tests: true
      - name: Publish checkstyle report
        if: failure()
        uses: jwgmeligmeyling/checkstyle-github-action@v1.2
        with:
          path: '**/build/reports/**/*.xml'
      - name: Publish spotbugs report
        if: failure()
        uses: jwgmeligmeyling/spotbugs-github-action@v1.2
        with:
          path: '**/build/reports/**/*.xml'
      - name: "Test if publishing works"
        run: ./gradlew publishToMavenLocal --info
      - name: "Tag release"
        if: github.ref == 'refs/heads/main'
        run: ./gradlew tagRelease --info

repositories {
    mavenCentral()
}
ext.projectName = "Wise Envoy xDS"
ext.projectDescription = "Wise Envoy xDS"
ext.projectArtifactName = "wise-envoy-xds-core"

apply from: "${rootDir}/build.common.gradle"
apply from: "${rootDir}/publishing.gradle"

apply plugin: 'info.solidsoft.pitest'

pitest {
    pitestVersion = "1.15.0"
    targetClasses = ['com.transferwise.envoy.xds*']
    outputFormats = ['XML', 'HTML']

    timestampedReports = false
    verbose = true
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java-util:3.25.5'
    implementation "com.google.guava:guava:33.3.1-jre"
    implementation 'io.grpc:grpc-stub:1.68.1'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.github.spotbugs:spotbugs-annotations:4.8.6'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    compileOnly 'com.transferwise.envoy:envoy-api:1.35.8-1' // Users are expected to provide a compatible envoy api
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    pitest 'org.pitest:pitest-junit5-plugin:1.2.1'
    testImplementation 'com.transferwise.envoy:envoy-api:1.35.8-1'
    testImplementation 'org.projectlombok:lombok:1.18.34'
}

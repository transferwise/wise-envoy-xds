repositories {
    mavenCentral()
}
ext.projectName = "Wise Envoy xDS Example E2E Tests"
ext.projectDescription = "Wise Envoy xDS Example E2E Tests"
ext.projectArtifactName = "wise-envoy-xds-e2e-tests"

apply from: "${rootDir}/build.common.gradle"
apply from: "${rootDir}/publishing.gradle"

dependencies {
    implementation "com.google.guava:guava:33.3.1-jre"
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.github.spotbugs:spotbugs-annotations:4.8.6'
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    implementation 'com.google.protobuf:protobuf-java-util:3.25.5'
    implementation 'io.grpc:grpc-stub:1.68.1'
    implementation project(':wise-envoy-xds-core')
    implementation project(':wise-envoy-xds-example')
    implementation 'com.transferwise.envoy:envoy-api:1.35.8-1'
    implementation 'org.projectlombok:lombok:1.18.34'
    implementation 'org.testcontainers:junit-jupiter:1.20.2'
    implementation('org.assertj:assertj-core:3.26.3')
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    testImplementation 'org.testcontainers:testcontainers:1.20.2'
    testImplementation 'org.awaitility:awaitility:4.2.2'
}
